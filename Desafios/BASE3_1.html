<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 3.1</title>

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
  }

  .carousel {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: Arial;
  }

  .viewport {
    width: 210px; /* tamanho de 1 slides */
    overflow: hidden;
    border-radius: 12px;
  }

  .track {
    display: flex;
    transition: transform 0.4s ease;
  }

  .card {
    width: 200px;
    height: 420px;
    flex-shrink: 0;
    margin-right: 10px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    color: white;
  }

  .card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
  }

  .card .text {
    padding: 8px;
  }

  button {
    padding: 10px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="carousel">

  <button onclick="prev()">‹</button>

  <div class="viewport">
    <div class="track" id="track"></div>
  </div>

  <button onclick="next()">›</button>

</div>

<script>
  const slides = [
    {
      img: "https://picsum.photos/seed/1/800/400",
      title: "Exemplo 1",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    },
    {
      img: "https://picsum.photos/seed/2/400/250",
      title: "Exemplo 2",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    },
    {
      img: "https://picsum.photos/seed/3/400/250",
      title: "Exemplo 3",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    },
    {
      img: "https://picsum.photos/seed/4/400/250",
      title: "Exemplo 4",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    },
    {
      img: "https://picsum.photos/seed/5/400/250",
      title: "Exemplo 5",
      desc: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
    }
  ];

  const track = document.getElementById("track");

  let index = 0;

  const visibleCards = 3;
  const cardWidth = 210;

  const maxIndex = slides.length - visibleCards;

  // cria os cards dinamicamente
  function render() {
    track.innerHTML = "";

    slides.forEach(slide => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <img src="${slide.img}">
        <div class="text">
          <strong>${slide.title}</strong><br>
          <small>${slide.desc}</small>
        </div>
      `;

      track.appendChild(div);
    });
  }

  function update() {
    track.style.transform = `translateX(-${index * cardWidth}px)`;
  }

  function next() {
    if (index < maxIndex) {
      index++;
      update();
    }
  }

  function prev() {
    if (index > 0) {
      index--;
      update();
    }
  }

  render();
  update();
</script>

</body>
</html>
