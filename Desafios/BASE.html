<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Exemplo 1</title>

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .carousel {
    width: 400px;
    text-align: center;
    font-family: Arial;
  }

  .img-container {
    position: relative;
  }

  .img-container img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 10px;
    transition: opacity 0.5s ease;
    opacity: 1;
  }

  .fade-out {
    opacity: 0;
  }

  .info {
    margin-top: 10px;
    padding: 10px;
  }

  button {
    margin: 10px;
    padding: 8px 12px;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="carousel">

  <div class="img-container">
    <img id="slide" src="" />
  </div>

  <div class="info" id="infoBox"></div>

  <div>
    <button onclick="prev()">Anterior</button>
    <button onclick="next()">Próximo</button>
  </div>

</div>

<script>
  //LISTA DOS SLIDES
  const slides = [
    {
      img: "https://picsum.photos/id/1015/400/250",
      title: "Montanhas",
      desc: "Uma paisagem montanhosa com neblina leve."
    },
    {
      img: "https://picsum.photos/id/1016/400/250",
      title: "Floresta",
      desc: "Floresta densa com luz passando entre as árvores."
    },
    {
      img: "https://picsum.photos/id/1018/400/250",
      title: "Estrada",
      desc: "Uma estrada vazia no meio da natureza."
    },
    {
      img: "https://picsum.photos/id/1020/400/250",
      title: "Lago",
      desc: "Um lago calmo refletindo o céu."
    }
  ];

  //ESTADO DO CARROSSEL, NUMERO QUE ELE PEGA DA LISTA A CIMA
  let index = 0;

  //LIGA O JS AO HTML / MOSTRA IMAGEM E TEXTO
  const img = document.getElementById("slide");
  const infoBox = document.getElementById("infoBox");
  const container = document.querySelector(".img-container");

  //FUNÇÃO DE TROCA DE SLIDE
  function updateSlide() {
    const slide = slides[index];

    img.classList.add("fade-out");

    setTimeout(() => {
      img.src = slide.img;
      infoBox.innerHTML = `<strong>${slide.title}</strong><br>${slide.desc}`;
      img.classList.remove("fade-out");
    }, 300);
  }

  //FUNÇÃO BOTÃO PROXIMO
  function next() {
    index = (index + 1) % slides.length;
    updateSlide();
  }

  //FUNÇÃO BOTÃO ANTERIOR
  function prev() {
    index = (index - 1 + slides.length) % slides.length;
    updateSlide();
  }

  //FUNÇÃO AUTOPLAY
  setInterval(() => {
    next();
  }, 4000);

  //COLOCA O PRIMEIRO SLIDE
  updateSlide();
</script>

</body>
</html>
