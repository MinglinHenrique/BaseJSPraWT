<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carrossel Estilo Simples + UI Avançada</title>

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #111;
  }

  .carousel-wrapper {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .carousel-content {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .viewport {
    width: 630px;
    overflow: hidden;
    border-radius: 12px;
  }

  .track {
    display: flex;
    transition: transform 0.4s ease;
  }

  .card {
    width: 200px;
    height: 420px;
    flex-shrink: 0;
    margin-right: 10px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    color: white;
  }

  .card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
  }

  .card .text {
    padding: 8px;
  }

  button {
    padding: 10px;
    cursor: pointer;
  }

  .dots {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #555;
    border: none;
    cursor: pointer;
  }

  .dot.active {
    background: white;
  }

  .counter {
    color: white;
    font-size: 12px;
    margin-top: 6px;
  }
</style>
</head>

<body>

<div class="carousel-wrapper">

  <button onclick="prev()">‹</button>

  <div class="carousel-content">

    <div class="viewport">
      <div class="track" id="track"></div>
    </div>

    <div class="dots" id="dots"></div>
    <div class="counter" id="counter"></div>

  </div>

  <button onclick="next()">›</button>

</div>

<script>
  const slides = [
    { img: "https://picsum.photos/seed/1/800/400", title: "Exemplo 1", desc: "Lorem ipsum dolor sit amet." },
    { img: "https://picsum.photos/seed/2/800/400", title: "Exemplo 2", desc: "Lorem ipsum dolor sit amet." },
    { img: "https://picsum.photos/seed/3/800/400", title: "Exemplo 3", desc: "Lorem ipsum dolor sit amet." },
    { img: "https://picsum.photos/seed/4/800/400", title: "Exemplo 4", desc: "Lorem ipsum dolor sit amet." },
    { img: "https://picsum.photos/seed/5/800/400", title: "Exemplo 5", desc: "Lorem ipsum dolor sit amet." }
  ];

  const track = document.getElementById("track");
  const dotsEl = document.getElementById("dots");
  const counter = document.getElementById("counter");

  let index = 0;
  const visibleCards = 3;
  const cardWidth = 210;
  const maxIndex = slides.length - visibleCards;

  function render() {
    track.innerHTML = "";
    dotsEl.innerHTML = "";

    slides.forEach(slide => {
      const div = document.createElement("div");
      div.className = "card";

      div.innerHTML = `
        <img src="${slide.img}">
        <div class="text">
          <strong>${slide.title}</strong><br>
          <small>${slide.desc}</small>
        </div>
      `;

      track.appendChild(div);
    });

    const totalDots = slides.length - visibleCards + 1;

    for (let i = 0; i < totalDots; i++) {
      const dot = document.createElement("button");
      dot.className = "dot";
      dot.onclick = () => { index = i; update(); };
      dotsEl.appendChild(dot);
    }
  }

  function update() {
    track.style.transform = `translateX(-${index * cardWidth}px)`;

    document.querySelectorAll(".dot").forEach((d, i) => {
      d.classList.toggle("active", i === index);
    });

    counter.textContent = `${index + 1} / ${slides.length - visibleCards + 1}`;
  }

  function next() {
    if (index < maxIndex) {
      index++;
      update();
    }
  }

  function prev() {
    if (index > 0) {
      index--;
      update();
    }
  }

  render();
  update();
</script>

</body>
</html>
